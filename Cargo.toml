[package]
name = "todoist"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven Todoist client for the terminal"

[dependencies]
chrono = "0.4.35"
color-eyre = "0.6.3"
crossterm = "0.28.1"
dirs = "5.0.1"
ratatui = "0.29.0"
reqwest = { version = "0.11.24", features = ["json"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
unicode-width = "0.2"
tokio = { version = "1.36.0", features = ["full"] }
tui-textarea = "0.7.0"
